[package]
name = "unclick-browser"
version = "0.8.2"
description = "UnClick Browser"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "unstable" unlocks multiwebview (Window::add_child) for the embedded live
# page view. The API is stable in practice on Windows/WebView2; every use is
# wrapped so a failure degrades to the fetch-and-read path.
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["gzip", "brotli", "deflate"] }
open = "5"
tokio = { version = "1", features = ["sync", "time"] }
